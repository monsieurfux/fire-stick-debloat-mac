<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Fire Stick Debloat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="flame">🔥</span> <span data-t="appTitle"></span></div>
    <div class="titlebar-right">
      <span id="stickBadge" class="badge hidden"></span>
      <button id="btnModeWizard" class="ghost small hidden" data-t="modeWizard"></button>
      <button id="btnModeTools" class="ghost small hidden" data-t="modeTools"></button>
      <div class="seg" title="Sprache / Language">
        <button id="langDe" class="small" data-lang="de">Deutsch</button>
        <button id="langEn" class="small" data-lang="en">English</button>
      </div>
    </div>
  </header>

  <main id="app">
    <!-- Guided setup: the main way through the app -->
    <section id="screen-wizard" class="screen">
      <nav class="sidebar" id="wizardNav"></nav>
      <div class="content">
        <div id="wizardPanel" class="panel"></div>
        <div class="console" id="console"></div>
      </div>
    </section>

    <!-- Tools: every single function on its own, like the Windows menu -->
    <section id="screen-tools" class="screen hidden">
      <nav class="sidebar">
        <button class="nav" data-panel="preview"><span class="key">1</span><span data-t="navPreview"></span></button>
        <button class="nav" data-panel="cleanup"><span class="key">2</span><span data-t="navCleanup"></span></button>
        <button class="nav" data-panel="undo"><span class="key">3</span><span data-t="navUndo"></span></button>
        <button class="nav" data-panel="launcher"><span class="key">4</span><span data-t="navLauncher"></span></button>
        <button class="nav" data-panel="install"><span class="key">5</span><span data-t="navInstall"></span></button>
        <button class="nav" data-panel="uninstall"><span class="key">6</span><span data-t="navUninstall"></span></button>
        <button class="nav" data-panel="projectivy"><span class="key">7</span><span data-t="navProjectivy"></span></button>
        <button class="nav" data-panel="reapply"><span class="key">8</span><span data-t="navReapply"></span></button>
        <div class="spacer"></div>
        <button class="nav" id="btnSwitch"><span class="key">S</span><span data-t="navSwitch"></span></button>
        <button class="nav" id="btnLogs"><span class="key">…</span><span data-t="navLogs"></span></button>
      </nav>
      <div class="content">
        <div id="toolsPanel" class="panel"></div>
        <div class="console" id="console2"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <p id="modalText"></p>
      <div class="actions">
        <button id="modalYes" class="primary"></button>
        <button id="modalNo" class="ghost"></button>
      </div>
    </div>
  </div>

  <div id="busy" class="busy hidden"><div class="spinner"></div><span id="busyText"></span></div>

  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
